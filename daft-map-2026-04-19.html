      iconAnchor: [9, 18],
      popupAnchor: [0, -18]
    });
  }

  markerData.forEach(function(d) {
    var marker = L.marker([d.lat, d.lon], {
      icon: buildDivIcon(d.color || '#7f7f7f')
    });
    marker.bindPopup(d.popup, {maxWidth: 420});
    marker.bindTooltip(d.tooltip, {sticky: true});
    d.marker = marker;
    markers.push(d);
  });

  function getSelectedValues(id) {
    var el = document.getElementById(id);
    if (!el) return [];
    return Array.from(el.selectedOptions)
      .map(function(opt) { return opt.value; })
      .filter(function(v) { return v !== ''; });
  }

  function matchesMulti(value, selectedValues) {
    return selectedValues.length === 0 || selectedValues.includes(value);
  }

  function updatePriceLabel(minVal, maxVal) {
    var label = document.getElementById('price-range-label');
    if (label) {
      label.textContent = euroFormat(minVal) + ' - ' + euroFormat(maxVal);
    }
  }

  function normalizePriceInputs() {
    var minEl = document.getElementById('filter-price-min');
    var maxEl = document.getElementById('filter-price-max');
    if (!minEl || !maxEl) return { minVal: 0, maxVal: 0 };

    var minVal = parseInt(minEl.value, 10);
    var maxVal = parseInt(maxEl.value, 10);

    if (minVal > maxVal) {
      var temp = minVal;
      minVal = maxVal;
      maxVal = temp;
      minEl.value = minVal;
      maxEl.value = maxVal;
    }

    updatePriceLabel(minVal, maxVal);
    return { minVal: minVal, maxVal: maxVal };
  }

  function matchesPrice(value, minVal, maxVal) {
    if (value === null || value === undefined || isNaN(value)) return false;
    return value >= minVal && value <= maxVal;
  }

  function clearSelections(id) {
    var el = document.getElementById(id);
    if (!el) return;
    Array.from(el.options).forEach(function(opt) {
      opt.selected = false;
    });
  }

  function applyFilters() {
    var ber = getSelectedValues('filter-ber');
    var quarter = getSelectedValues('filter-quarter');
    var beds = getSelectedValues('filter-beds');

    var priceState = normalizePriceInputs();
    var minPrice = priceState.minVal;
    var maxPrice = priceState.maxVal;

    markerLayer.clearLayers();

    var visible = 0;
    markers.forEach(function(d) {
      var ok =
        matchesMulti(d.ber, ber) &&
        matchesMulti(d.quarter, quarter) &&
        matchesMulti(d.beds, beds) &&
        matchesPrice(d.sold_price_num, minPrice, maxPrice);

      if (ok) {
        markerLayer.addLayer(d.marker);
        visible += 1;
      }
    });

    var countEl = document.getElementById('filter-count');
    if (countEl) {
      countEl.textContent = 'Showing ' + visible + ' properties';
    }
  }

  ['filter-ber', 'filter-quarter', 'filter-beds'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', applyFilters);
    }
  });

  ['filter-price-min', 'filter-price-max'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', applyFilters);
      el.addEventListener('change', applyFilters);
    }
  });

  var resetBtn = document.getElementById('filter-reset');
  if (resetBtn) {
    resetBtn.addEventListener('click', function() {
      clearSelections('filter-ber');
      clearSelections('filter-quarter');
      clearSelections('filter-beds');

      var minEl = document.getElementById('filter-price-min');
      var maxEl = document.getElementById('filter-price-max');
      if (minEl) minEl.value = minEl.min;
      if (maxEl) maxEl.value = maxEl.max;

      applyFilters();
    });
  }

  normalizePriceInputs();
  applyFilters();
});
